<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список участников</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #19191a; color: #e1e3e6; padding: 16px; margin: 0; }
        .header { margin-bottom: 20px; text-align: center; }
        .title { font-size: 20px; font-weight: 600; }
        .subtitle { color: #828282; margin-top: 8px; font-size: 14px; }
        .user-card { display: flex; align-items: center; padding: 12px 16px; background: #232324; margin-bottom: 8px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .user-card:active { background: #2d2d2e; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #4a76a8; margin-right: 16px; object-fit: cover; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: white; }
        .name { font-size: 16px; font-weight: 500; color: #e1e3e6; text-decoration: none; }
    </style>
</head>
<body>
    <script>vkBridge.send('VKWebAppInit');</script>

    <div class="header">
        <div class="title" id="event-title">Загрузка...</div>
        <div class="subtitle" id="event-subtitle"></div>
    </div>
    <div id="users-list"></div>

                <script>
        // 1. Инициализация (убирает спиннер)
        vkBridge.send('VKWebAppInit');

        // 2. Максимально простой поиск ID
        function getEventId() {
            // Ищем в хеше (после #)
            const hash = window.location.hash.substring(1);
            const hashParams = new URLSearchParams(hash);
            if (hashParams.get('event_id')) return hashParams.get('event_id');

            // Ищем в обычных параметрах (после ?)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('event_id')) return urlParams.get('event_id');

            // Если ВК как-то сломал URL, просто ищем текст "event_id=" в ссылке
            const match = window.location.href.match(/event_id=(\d+)/);
            if (match) return match[1];

            return null;
        }

        async function loadData() {
            const eventId = getEventId();
            
            if (!eventId) {
                document.getElementById('event-title').innerText = "Ошибка: ID не найден";
                // Выводим ссылку на экран, чтобы понять, что видит ВК
                document.getElementById('event-subtitle').innerText = "URL: " + window.location.href;
                return;
            }

            fetch(`/api/event/${eventId}/users`)
                .then(res => {
                    if (!res.ok) throw new Error("404");
                    return res.json();
                })
                .then(data => {
                    document.getElementById('event-title').innerText = data.title;
                    document.getElementById('event-subtitle').innerText = `Записались: ${data.users.length} / ${data.max_volunteers}`;
                    
                    const list = document.getElementById('users-list');
                    if (data.users.length === 0) {
                        list.innerHTML = "<div style='text-align:center; color:#828282; margin-top:40px;'>Пока никто не записался 😢</div>";
                        return;
                    }

                    list.innerHTML = "";
                    data.users.forEach((user, index) => {
                        const avatarHtml = user.avatar 
                            ? `<img src="${user.avatar}" class="avatar" alt="">`
                            : `<div class="avatar">${user.name[0]}</div>`;

                        list.innerHTML += `
                            <div class="user-card" onclick="openProfile(${user.id})">
                                ${avatarHtml}
                                <div class="name">${index + 1}. ${user.name}</div>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    document.getElementById('event-title').innerText = "Ошибка загрузки данных";
                });
        }

        function openProfile(vkId) {
            vkBridge.send('VKWebAppOpenProfile', { user_id: vkId }).catch(console.error);
        }

        loadApp();

        function loadApp() {
            // Небольшая задержка, чтобы ВК успел передать данные в iframe
            setTimeout(loadData, 100);
        }
    </script>
</body>
</html>

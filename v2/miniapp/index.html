<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список участников</title>
    <!-- Подключаем официальную библиотеку ВК для Mini Apps -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #19191a; color: white; padding: 20px; margin: 0; }
        .user-card { display: flex; align-items: center; padding: 12px; background: #232324; margin-bottom: 8px; border-radius: 12px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #4a76a8; margin-right: 16px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="title" id="event-title">Загрузка...</div>
    <div class="subtitle" id="event-subtitle"></div>
    <div id="users-list"></div>

    <script>
        // ОБЯЗАТЕЛЬНО: Сообщаем ВК, что приложение загрузилось
        vkBridge.send('VKWebAppInit');

        // Универсальный поиск event_id (и в ?, и в #)
        const urlParams = new URLSearchParams(window.location.search);
        let eventId = urlParams.get('event_id');

        if (!eventId) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            eventId = hashParams.get('event_id');
        }

        if (!eventId) {
            document.getElementById('event-title').innerText = "Ошибка: ID мероприятия не найден";
        } else {
            // Запрашиваем данные у Python API
            fetch(`/api/event/${eventId}/users`)
                .then(res => {
                    if (!res.ok) throw new Error("Сервер не нашел данные");
                    return res.json();
                })
                .then(data => {
                    document.getElementById('event-title').innerText = data.title;
                    document.getElementById('event-subtitle').innerText = `Всего записалось: ${data.users.length} / ${data.max_volunteers}`;
                    
                    const list = document.getElementById('users-list');
                    
                    if (data.users.length === 0) {
                        list.innerHTML = "<p style='text-align:center; color:#888;'>Пока никто не записался 😢</p>";
                        return;
                    }

                    data.users.forEach((user, index) => {
                        list.innerHTML += `
                            <div class="user-card">
                                <div class="avatar">${user.name[0]}</div>
                                <div>${index + 1}. ${user.name}</div>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    // Если база данных Render пустая, мы увидим эту ошибку, а не спиннер
                    document.getElementById('event-title').innerText = "Список пуст (База данных на Render не связана с локальной)";
                    console.error(err);
                });
        }
    </script>
</body>
</html>
